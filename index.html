<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>여행 노트</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #5f6b77;
      --line: #d8dee6;
      --paper: #fbfcfd;
      --card: #ffffff;
      --link: #174a68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
      line-height: 1.55;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 56px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .mascot {
      flex: 0 0 auto;
      width: 70px;
      height: 70px;
      border-radius: 16px;
      display: block;
    }

    .title-block {
      min-width: 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.28;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .trip-list {
      display: grid;
      gap: 12px;
      margin-top: 22px;
    }

    .trip-card {
      display: block;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .trip-card:hover {
      border-color: #9fb7c7;
      box-shadow: 0 3px 12px rgba(23, 32, 42, 0.08);
    }

    .trip-card h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 6px;
      color: var(--link);
      font-size: 18px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .trip-card h2::before {
      content: "✓";
      color: #b6463a;
      font-weight: 700;
    }

    .trip-card span {
      display: block;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 24px, 920px);
        padding-top: 24px;
      }

      h1 { font-size: 24px; }

      header {
        align-items: flex-start;
        gap: 12px;
      }

      .mascot {
        width: 58px;
        height: 58px;
        border-radius: 14px;
      }

      .trip-card {
        padding: 16px;
      }
    }
  </style>
</head>
